<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#FBF8F2"/>
      <stop offset="100%" stop-color="#EFE8DD"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5E4B5"/>
      <stop offset="50%" stop-color="#D4AF6A"/>
      <stop offset="100%" stop-color="#A27933"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#4A2C1D" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#bgGrad)"/>
  <rect x="12" y="12" width="376" height="376" rx="12" fill="none" stroke="#D4AF6A" stroke-width="1" stroke-opacity="0.4"/>
  <rect x="20" y="20" width="360" height="360" rx="8" fill="none" stroke="#D4AF6A" stroke-width="0.5" stroke-dasharray="4,4" stroke-opacity="0.5"/>

  <!-- Rangoli Watermark -->
  <g opacity="0.07" transform="translate(100, 100) scale(1)">
    <circle cx="100" cy="100" r="90" stroke="#3D2013" stroke-width="2" fill="none"/>
    <circle cx="100" cy="100" r="60" stroke="#3D2013" stroke-width="1.5" fill="none"/>
    <circle cx="100" cy="100" r="30" stroke="#3D2013" stroke-width="1" fill="none"/>
  </g>

  <!-- Jewellery Illustration -->
  <g filter="url(#softGlow)" transform="translate(0, -10)">
    <path d="M120 100 C140 290 260 290 280 100 C260 270 140 270 120 100 Z" fill="url(#gold)" stroke="#875E1E" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- Gems sparkle -->
    <circle cx="200" cy="200" r="6" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="170" cy="180" r="4" fill="#FFFFFF" opacity="0.7"/>
    <circle cx="230" cy="180" r="4" fill="#FFFFFF" opacity="0.7"/>
  </g>

  <!-- Badge / Brand Tag -->
  <rect x="100" y="335" width="200" height="32" rx="16" fill="#FDFBF6" stroke="#D4AF6A" stroke-width="1"/>
  <text x="200" y="356" fill="#3D2013" font-family="'Playfair Display', Georgia, serif" font-weight="600" font-size="13" text-anchor="middle" letter-spacing="1">Micro Gold Plated Rudraksha Mala Chain</text>
</svg>